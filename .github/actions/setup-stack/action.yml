# Instala as ferramentas da stack detectada pelos arquivos do repositório. Ações fixadas por SHA.
name: setup-stack
description: Node, Python, Go, Java, Flutter, Deno e Supabase CLI conforme os arquivos do projeto
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        flag() { if eval "$1"; then echo 1; else echo 0; fi; }
        {
          echo "node=$(flag '[ -f package.json ]')"
          echo "python=$(flag '[ -f pyproject.toml ] || [ -f requirements.txt ]')"
          echo "go=$(flag '[ -f go.mod ]')"
          echo "java=$(flag '[ -f firebase.json ] || [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]')"
          echo "flutter=$(flag 'grep -qE "sdk: *flutter" pubspec.yaml 2>/dev/null')"
          echo "deno=$(flag '[ -d supabase/functions ]')"
          echo "supabase=$(flag '[ -f supabase/config.toml ]')"
        } >> "$GITHUB_OUTPUT"
    - if: steps.detect.outputs.node == '1'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - if: steps.detect.outputs.python == '1'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - if: steps.detect.outputs.go == '1'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - if: steps.detect.outputs.java == '1'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'  # emulador do Firebase (firebase-tools 15) exige 21
    - if: steps.detect.outputs.flutter == '1'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
    - if: steps.detect.outputs.deno == '1'
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with:
        deno-version: v2.9.7
    - if: steps.detect.outputs.supabase == '1'
      uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: 2.118.0
