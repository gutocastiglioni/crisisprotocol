# CI do jogo: só o que vale para ele (sem backend, rede nem dados pessoais).
# - segredos: nenhuma chave/token no histórico do git (o repositório é público)
# - testes: a mesma suíte do hook local (node tools/run_godot_tests.mjs) no Godot 4.7.2 headless
# Ações fixadas por SHA; binários por checksum.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: instalar gitleaks v8.30.1 (binário oficial, checksum conferido)
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
      # histórico inteiro: segredo apagado num commit posterior continua vazado (rotacione a chave)
      - run: ./gitleaks git . --redact --no-banner --exit-code 1

  tests:
    name: testes do jogo (Godot 4.7.2 headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: instalar Godot 4.7.2 (binário oficial, checksum conferido)
        run: |
          curl -sSLo godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  godot.zip" | sha512sum -c -
          unzip -q godot.zip && rm godot.zip
          echo "GODOT_BIN=$PWD/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: node tools/run_godot_tests.mjs
